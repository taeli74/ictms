<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy ICT Master</title>
<meta name="robots" content="noindex,nofollow">
<script>/* Easy ICT Master — 단독 실행용 저장소 (브라우저 localStorage + IndexedDB). claude.ai 런타임이 없는 환경에서 db/assets/downloads/user를 대신합니다. */
(function(){
var P='ictm:',subs={},PH={},idb=null;
function load(n){try{return JSON.parse(localStorage.getItem(P+n)||'{}');}catch(e){return {};}}
function snap(n){var o=load(n);return{docs:Object.keys(o).map(function(id){return{id:id,data:function(){return o[id];}};})};}
function notify(n){(subs[n]||[]).forEach(function(cb){try{cb(snap(n));}catch(e){console.error(e);}});}
function put(n,o){try{localStorage.setItem(P+n,JSON.stringify(o));}catch(e){var er=new Error('저장 공간이 가득 찼습니다. 백업 후 사진을 줄여 주세요.');er.code='quota';throw er;}}
addEventListener('storage',function(e){if(e.key&&e.key.indexOf(P)===0)notify(e.key.slice(P.length));});
var db={collection:function(n){return{
  onSnapshot:function(cb){(subs[n]=subs[n]||[]).push(cb);setTimeout(function(){cb(snap(n));},0);return function(){};},
  doc:function(id){return{
    set:async function(d){var o=load(n);o[id]=JSON.parse(JSON.stringify(d));put(n,o);notify(n);},
    delete:async function(){var o=load(n);delete o[id];put(n,o);notify(n);}};}};}};
var ready=new Promise(function(res){
  try{var rq=indexedDB.open('ictm',1);rq.onupgradeneeded=function(){rq.result.createObjectStore('photos');};
    rq.onerror=function(){res();};rq.onsuccess=function(){idb=rq.result;try{var cu=idb.transaction('photos').objectStore('photos').openCursor();
      cu.onsuccess=function(){var c=cu.result;if(c){PH[c.key]=c.value;c.continue();}else res();};cu.onerror=function(){res();};}catch(e){res();}};}catch(e){res();}});
function idbPut(k,v){return new Promise(function(r){if(!idb){r();return;}try{var t=idb.transaction('photos','readwrite');t.objectStore('photos').put(v,k);t.oncomplete=r;t.onerror=r;}catch(e){r();}});}
function idbClear(){return new Promise(function(r){if(!idb){r();return;}try{var t=idb.transaction('photos','readwrite');t.objectStore('photos').clear();t.oncomplete=r;t.onerror=r;}catch(e){r();}});}
function toData(b){return new Promise(function(res,rej){var f=new FileReader();f.onload=function(){res(f.result);};f.onerror=rej;f.readAsDataURL(b);});}
var assets={upload:async function(b){var id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);var d=await toData(b);PH[id]=d;await idbPut(id,d);return{id:id};}};
var downloads={save:async function(r){var u=URL.createObjectURL(r.data);var a=document.createElement('a');a.href=u;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);return{status:'saved'};}};
var user={can:function(){return true;},canEdit:function(){return true;}};
window.blobUrl=function(id){return PH[id]||'';};
window.claude={use:async function(n){await ready;return({db:db,assets:assets,downloads:downloads,user:user})[n]||null;}};
window.backupCard=function(){
  var msg=h('div');var say=function(m,e){msg.replaceChildren(h('div',{class:'note'+(e?' err':'')},m));};
  var cols=['sites','inspections','issues','companies','people','clients','accounts','memos','locations'];
  var exp=function(){var o={app:'easy-ict-master',v:1,at:new Date().toISOString(),db:{},photos:PH};cols.forEach(function(c){o.db[c]=load(c);});
    var b=new Blob([JSON.stringify(o)],{type:'application/json'});downloads.save({filename:'easy-ict-master-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.json',data:b});say('백업 파일을 내려받았습니다.');};
  var f=h('input',{type:'file',accept:'application/json,.json',style:'display:none'});
  f.addEventListener('change',async function(){var x=f.files[0];if(!x)return;try{var o=JSON.parse(await x.text());
      if(!o||o.app!=='easy-ict-master'||!o.db)throw new Error('이 서비스의 백업 파일이 아닙니다.');
      if(!confirm('현재 이 기기의 데이터를 백업 파일 내용으로 교체합니다. 계속할까요?'))return;
      cols.forEach(function(c){put(c,o.db[c]||{});});PH={};await idbClear();var ks=Object.keys(o.photos||{});
      for(var i=0;i<ks.length;i++){if(/^data:image\//.test(o.photos[ks[i]])){PH[ks[i]]=o.photos[ks[i]];await idbPut(ks[i],o.photos[ks[i]]);}}
      say('복원했습니다. 다시 불러옵니다…');setTimeout(function(){location.reload();},700);}
    catch(e){say('복원 실패: '+(e.message||e),1);}f.value='';});
  return h('div',{class:'card'},h('h3',{},'데이터 백업 / 복원'),
    h('div',{class:'muted',style:'margin-bottom:10px'},'이 버전은 서버 없이 이 기기의 브라우저에만 저장합니다. 브라우저 데이터를 지우면 사라지므로 정기적으로 백업하세요. 다른 기기로 옮길 때도 백업 파일을 사용합니다.'),
    h('div',{class:'row'},h('button',{class:'pri',onclick:exp},'백업 내려받기'),h('button',{onclick:function(){f.click();}},'백업 불러오기'),f,h('div',{class:'grow'}),msg));};
})();
</script>

/* 레이아웃: 데스크톱은 좌측 레일 + 본문, 모바일은 하단 탭. 영역 코드는 케이블 라벨 태그, 항목 진행은 색 띠 */
:root{color-scheme:light;--bg:#f3f3f2;--surface:#fff;--surface2:#f7f7f6;--ink:#111;--ink2:#333;--mut:#595959;--line:#e2e2e0;--line2:#b9b9b6;
 --accent:#111;--accent-soft:#ececea;--rail:#111;--rail-ink:#c4c4c1;
 --ok:#111;--ok-soft:#ececea;--ng:#111;--ng-soft:#ececea;--warn:#111;--warn-soft:#ececea;--na:#595959;--na-soft:#e6e6e4;
 --hatch:repeating-linear-gradient(135deg,#111 0 2px,#fff 2px 5px);
 --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.06);--r:12px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Nanum Gothic",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:20px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;color:#fff}
.brand svg{width:34px;height:34px;flex:none}.brand b{display:block;font-size:16px;line-height:1.1;letter-spacing:-.01em}.brand small{display:block;font-size:11px;color:var(--rail-ink);margin-top:2px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rn{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--rail-ink);padding:10px 12px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;text-align:left;position:relative}
.rn:hover{background:rgba(255,255,255,.06);color:#fff}.rn.on{background:rgba(255,255,255,.1);color:#fff}
.rn.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.cnt{font-style:normal;margin-left:auto;background:var(--ng);color:#fff;font-size:11px;font-weight:700;border-radius:99px;min-width:20px;text-align:center;padding:0 6px;line-height:20px}
.rail-foot{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}.rail-foot b{display:block;color:#fff;font-size:13px;margin-bottom:2px}
.stage{min-width:0}
.top{display:none;align-items:center;gap:10px;padding:10px 16px;background:var(--rail);color:#fff;position:sticky;top:0;z-index:30}
.top .brand{padding:0}.top .brand svg{width:28px;height:28px}.top .tag2{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);padding:3px 10px;border-radius:99px}
main{max-width:1040px;margin:0 auto;padding:28px 32px 80px}
.tabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:500;padding:6px 0;border-radius:10px;position:relative;cursor:pointer}
.tab.on{color:var(--accent);font-weight:700}.tab .cnt{position:absolute;top:2px;left:calc(50% + 6px);margin:0;min-width:16px;line-height:16px;font-size:10px}
.pagehead{margin:0 0 20px}.pagehead h2{margin:0;font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.025em;text-wrap:balance}.pagehead p{margin:4px 0 0;color:var(--mut);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.sb{justify-content:space-between}.grow{flex:1;min-width:150px}.sm{font-size:12.5px}
.muted{color:var(--mut);font-size:13px}.num{font-variant-numeric:tabular-nums}.err{color:var(--ng)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;font-weight:500}.note.err{background:var(--ng-soft);color:var(--ng)}
label.f{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 5px;font-weight:500}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;font:inherit;background:var(--surface);color:var(--ink)}
textarea{min-height:76px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input:disabled,textarea:disabled,select:disabled{background:var(--surface2);color:var(--mut)}
button{font:inherit;font-weight:500;min-height:40px;padding:0 15px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer;transition:background .12s,border-color .12s}
button:hover{background:var(--surface2)}button.pri{background:var(--accent);border-color:var(--accent);color:#fff}button.pri:hover{filter:brightness(1.08);background:var(--accent)}
button.dng{color:var(--ng);border-color:color-mix(in srgb,var(--ng) 40%,var(--line2))}button.big{min-height:50px;padding:0 22px;font-size:16px;font-weight:600}button:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px 2px 8px;border-radius:99px;background:var(--na-soft);color:var(--na);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.ng{background:var(--ng-soft);color:var(--ng)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.pri{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-block;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 10px}

  steps:['관리주체 입회하에 로그인 화면 또는 설정 > 계정 메뉴를 연다.','기본 계정(admin 등)과 초기 비밀번호가 그대로인지 확인한다.','비밀번호 자체는 화면·사진에 남기지 않는다.'],shot:'비밀번호가 보이지 않게 설정 화면만'},
 {m:/보안 패치/,std:'운영체제·소프트웨어가 최신 보안 패치 상태이거나, 대기 중인 중요 패치가 없다.',ng:'수개월 이상 업데이트가 안 되어 있다. 중요 업데이트가 대기 중이다.',
  steps:['설정 > 업데이트(Windows Update 등) 화면을 연다.','마지막 업데이트 날짜와 대기 중인 항목을 확인한다.','폐쇄망이면 관리주체의 패치 정책을 먼저 확인한다.'],shot:'업데이트 화면'},
 {m:/펌웨어/,std:'장비 펌웨어가 제조사가 권고하는 최신(또는 안정) 버전이다.',ng:'제조사가 보안 결함 등으로 업데이트를 권고한 버전보다 한참 낮다.',
  steps:['장비 관리 화면에서 현재 펌웨어 버전을 확인한다.','제조사 지원 페이지의 최신 버전과 비교한다.','업데이트는 관리주체 승인 후 따로 진행한다. 점검 중 임의로 올리지 않는다.'],shot:'버전 정보 화면'},
 {m:/백신/,std:'백신이 설치되어 실행 중이고, 최신 엔진·패턴으로 갱신되어 있다.',ng:'백신이 없거나 꺼져 있다. 라이선스가 만료됐다. 갱신이 오래 멈춰 있다.',
  steps:['백신 프로그램을 열어 실행(보호) 상태를 본다.','마지막 갱신일과 라이선스 만료일을 확인한다.'],shot:'백신 상태 화면'},
 {m:/바이러스|악성코드/,std:'최근 바이러스·악성코드 경고 이벤트가 없거나, 있다면 이미 조치되어 있다.',ng:'조치되지 않은 경고·검역 이력이 남아 있다.',
  steps:['백신 로그(검사·탐지 이력)를 연다.','최근 기간의 탐지 건수와 조치 여부를 확인한다.'],shot:'이벤트 로그 화면'},
 {m:/VLAN|VPN/,std:'VLAN·VPN 등 보안 기능이 설계(운영 계획)대로 설정되어 있고 각 기능이 정상 동작한다.',ng:'설정이 빠져 있다. 의도하지 않은 포트·대역이 열려 있다.',
  steps:['장비 설정 화면에서 VLAN·VPN 설정 목록을 연다.','설계서 또는 관리주체 설명과 비교한다.','가능하면 연결 시험(ping 등)으로 동작을 확인한다.'],shot:'설정 화면'},
 {m:/하드디스크 저장|저장공간 여유|저장 공간/,std:'저장 공간에 여유가 충분하다. (통상 전체 용량의 20% 이상 여유를 권장)',ng:'여유 공간이 거의 없어 녹화·저장이 멈추거나 시스템이 느려질 위험이 있다.',
  steps:['내 PC·디스크 관리(또는 저장소 화면)에서 전체·사용·남은 용량을 확인한다.','여유가 부족하면 정리가 필요하다. 삭제·정리는 관리주체 승인 후에 한다.'],shot:'용량 표시 화면'},
 {m:/예비전원.*(배선|연결)/,std:'UPS·발전기 등 예비전원의 배선이 단자에 견고히 체결되어 있고, 피복 손상·탄 자국·헐거운 단자가 없다.',ng:'배선이 느슨하다. 피복이 벗겨졌거나 변색·탄 자국이 있다. UPS에 경고 표시가 떠 있다.',
  steps:['UPS 전면 표시창의 상태(정상·경고)를 확인한다.','배선과 콘센트·단자를 눈으로 보고, 헐거워 보이면 상태를 기록한다.','경고 LED나 배터리 교체 표시가 있는지 본다.'],shot:'UPS 전면 표시와 배선부'},
 {m:/바이패스|이중화/,std:'절체(전환) 시 서비스 중단이나 오류 없이 예비 장치로 넘어가고, 복귀도 정상이다.',ng:'절체 중 전원 차단·서비스 끊김이 생긴다. 이중화 장치가 동작하지 않는다.',
  steps:['반드시 관리주체와 시간·방법을 먼저 협의하고 입회를 받는다.','제조사 절차에 따라 절체를 시험하고, 화면·부하 장비가 유지되는지 본다.','시험 후 원래 상태로 되돌려 둔다.'],shot:'절체 전·후 표시 화면'},
 {m:/동영상 촬영|녹화 영상/,std:'모든 카메라 영상이 끊김·깨짐 없이 표시·저장되고, 정해진 보관 기간만큼 저장되며, 재생 화질로 사람·차량을 식별할 수 있다.',ng:'특정 채널이 안 나온다. 녹화가 비어 있다. 화면이 깨지거나 너무 어둡다. 보관 기간이 부족하다.',
  steps:['모니터에서 전 채널 실시간 영상을 하나씩 확인한다.','녹화 영상을 임의 시점(낮·밤 각 1건)으로 재생해 화질을 확인한다.','저장 보관 일수를 설정 화면에서 확인한다.'],shot:'모니터 전체 화면과 재생 화면'},
 {m:/^외관 상태 점검/,std:'오염·부식·손상·파손이 없고 깨끗한 상태이다.',ng:'먼지가 두껍게 쌓였다. 녹·부식이 있다. 균열·찌그러짐·파손이 있다. 물이 샌 흔적이 있다.',
  steps:['설비의 앞·뒤·옆·아래를 천천히 돌며 눈으로 본다.','구석과 아래쪽은 손전등으로 비춰 본다.','이상 부위는 가까이서 한 장, 설비 전체가 보이게 한 장 찍는다.'],tools:'손전등',shot:'이상 부위 근접 + 설비 전체'},
 {m:/고정 및 취부|고정 상태|고정 장치|체결/,std:'설비가 벽·랙·바닥에 견고히 고정되어 있고, 흔들림·기울어짐·탈락·볼트 풀림이 없다.',ng:'손으로 밀면 흔들린다. 볼트·너트가 빠졌거나 헐겁다. 기울어져 떨어질 우려가 있다.',
  steps:['설비를 손으로 가볍게 흔들어 본다. (무거운 장비는 무리하게 밀지 않는다)','고정 볼트·브라켓·너트가 빠지거나 헐거운지 눈으로 본다.'],shot:'고정부(볼트·브라켓) 근접'},
 {m:/작동 표시부/,std:'전원·통신 램프(LED)와 표시창이 정상 상태로 켜져 있고, 경고(적색·점멸) 표시가 없다.',ng:'램프가 꺼져 있다. 적색·주황 경고등이나 오류 메시지가 떠 있다. 표시창이 깨졌다.',
  steps:['설비 전면·후면의 전원·링크·상태 램프를 본다.','램프 색·점멸이 무엇을 뜻하는지 제조사 설명서(또는 장비 라벨)로 확인한다.'],shot:'램프·표시창이 한 장에 보이게'},
 {m:/연결 케이블 및 커넥터|케이블 및 커넥터|케이블 연결|케이블 결선/,std:'케이블 피복이 멀쩡하고 커넥터가 끝까지 체결되어 있으며, 꺾임·당김이 없다.',ng:'커넥터가 헐겁다. 피복이 벗겨졌거나 눌린 자국이 있다. 케이블이 심하게 꺾이거나 팽팽하게 당겨져 있다.',
  steps:['케이블을 따라가며 피복 손상과 꺾임을 눈으로 본다.','커넥터를 가볍게 잡고 흔들어 빠지거나 헐거운지 본다.'],shot:'커넥터 근접'},
 {m:/주변기기/,std:'모니터·키보드·마우스 등이 파손 없이 연결되어 정상 동작한다.',ng:'모니터가 깜빡이거나 안 켜진다. 키보드·마우스가 반응하지 않는다. 본체와의 연결이 헐겁다.',
  steps:['각 기기가 제대로 연결되어 있는지 본다.','키보드 입력, 마우스 이동, 모니터 표시를 직접 눌러 확인한다.'],shot:'주변기기 전체'},
 {m:/전원 단자|전원공급 단자/,std:'전원 케이블·단자가 견고히 체결되어 있고, 변색·탄 흔적·과열 흔적이 없다. 멀티탭에 부하가 몰려 있지 않다.',ng:'단자가 헐겁다. 단자 주변이 검게 변했거나 녹은 흔적이 있다. 멀티탭 여러 개를 이어 쓰고 있다.',
  steps:['전원 코드와 단자를 눈으로 본다. (젖은 손·활선 접촉 금지)','멀티탭·콘센트 주변에 탄 냄새나 변색이 있는지 본다.'],shot:'전원 단자 근접'},
 {m:/설치 환경|재해/,std:'먼지가 적고 결로·누수가 없으며, 온도·습도가 장비 사양 범위 안이다. (통상 온도 18~27℃, 습도 40~60%를 권장)',ng:'먼지가 많이 쌓였다. 천장·벽에서 물이 샌다. 너무 덥거나 습해 결로가 생긴다.',
  steps:['실내에 들어서 냄새·먼지·물기를 확인한다.','온습도계가 있으면 값을 읽는다.','천장·바닥 모서리의 누수 흔적을 본다.'],tools:'온습도계(있으면)',shot:'실내 전경 + 온습도계'},
 {m:/이상 발열/,std:'설비가 과하게 뜨겁지 않고 타는 냄새가 없으며, 이상 소음(마찰음·딸깍 소리·경보음)이 없다.',ng:'손을 가까이 대면 뜨겁다. 타는 냄새가 난다. 팬이 갈리는 소리나 경보음이 난다.',
  steps:['설비 앞에 서서 소리를 듣고 냄새를 맡는다.','손등을 가까이 대 열기를 느낀다. (직접 만지지 않는다)','적외선 온도계가 있으면 표면 온도를 잰다.'],tools:'적외선 온도계(있으면)',shot:'이상 부위 + 설비 전체'},
 {m:/조명설비/,std:'설비 설치 공간의 조명이 모두 켜지고, 작업·판독에 충분히 밝다.',ng:'조명이 꺼졌거나 깜빡인다. 어두워서 라벨·표시창을 읽기 어렵다.',
  steps:['조명 스위치를 켜 모든 등이 들어오는지 본다.','장비 라벨·표시창이 잘 읽히는지 본다.'],shot:'설치 공간 전경'},
 {m:/항온항습|환기/,std:'항온항습기·환기 장치가 정상 가동하고, 설정 온·습도가 유지되며 경보가 없다.',ng:'가동이 멈춰 있다. 경보 표시가 떠 있다. 실내가 설정과 다르게 덥거나 습하다. 배수(드레인)가 막혀 있다.',
  steps:['항온항습기 표시창의 설정값·현재값·경보를 본다.','송풍 소리·바람이 정상인지 확인한다.','배수 호스와 주변 바닥에 물이 새는지 본다.'],shot:'표시창과 주변 바닥'},
 {m:/접지 상태|트레이 접지/,std:'접지선이 접지단자에 견고히 연결되어 있고, 피복 손상·부식·이탈이 없다.',ng:'접지선이 빠져 있다. 단자가 녹슬었다. 접지선이 끊기거나 피복이 벗겨졌다.',
  steps:['접지선(주로 녹색 또는 녹황색)이 접지단자에 물려 있는지 눈으로 본다.','단자 볼트가 헐겁거나 녹슬었는지 본다.'],shot:'접지선 연결부 근접'},
 {m:/냉각팬/,std:'모든 냉각팬이 회전하고, 이상 소음·진동이 없으며 먼지로 막혀 있지 않다.',ng:'팬이 멈췄다. 갈리는 소리가 난다. 먼지로 흡기구가 막혀 있다. 팬 경고 LED가 켜져 있다.',
  steps:['설비 뒷면·측면에서 팬 소리와 바람을 확인한다.','팬 경고 LED나 관리 화면의 팬 상태를 본다.'],shot:'팬 부위 또는 경고 화면'},
 {m:/시건|잠금 장치/,std:'문이 잘 닫히고 잠금 장치가 정상 동작하며, 열쇠·도어락에 파손이 없다.',ng:'문이 안 닫힌다. 잠금이 풀려 있다. 열쇠가 안 맞거나 도어락이 고장이다.',
  steps:['문을 닫고 잠금 장치를 직접 잠가 본다.','다시 열어 열쇠·번호키가 정상 동작하는지 본다.'],shot:'잠금 장치 근접'},
 {m:/Console|네트워크 연결|네트워크 연동|링크 동작|유무선 네트워크|실시간 통신 연결/,std:'장비가 네트워크에 정상 접속되고 응답(ping)이 빠르며, 링크 LED가 켜져 있고 끊김이 없다.',ng:'접속이 안 된다. ping 응답이 없거나 자주 끊긴다. 링크 LED가 꺼져 있다.',
  steps:['장비의 링크 LED가 켜져 있는지 본다.','점검용 PC 등에서 ping 또는 접속 시험을 한다.','응답 속도와 끊김을 기록한다.'],tools:'점검용 노트북(ping)',shot:'LED와 ping 결과 화면'},
 {m:/사용율|Activity/,std:'CPU·메모리·디스크 사용률이 평소 범위로 안정적이고, 연동 정보가 정상 갱신된다.',ng:'사용률이 계속 90% 이상이다. 연동이 멈춰 있다. 오류 이벤트가 쌓인다.',

function h(tag,attrs,...kids){const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}

  return e;}

async function sha(pw,salt){const t=salt+':'+pw;
  try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let v=5381;for(const c of t)v=((v<<5)+v+c.charCodeAt(0))|0;return 'f'+(v>>>0).toString(16);}}
